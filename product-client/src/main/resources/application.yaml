spring:
  application:
    name: product-client
  http:
    clients:
      # Timeout delle chiamate HTTP verso la Producer
      connect-timeout: 2s
      read-timeout: 5s
  cache:
    # Cache locale: evita nuove chiamate HTTP finché i dati non sono scaduti
    cache-names: prodotti,prodotto
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

server:
  port: 8082
  servlet:
    session:
      # Flash messages use the session: keep ;jsessionid out of redirect URLs
      tracking-modes: cookie

# Indirizzo della Producer API (product-api)
api:
  base-url: http://localhost:8081/api
  # Values of the Producer Category enum (the Producer has no endpoint listing them)
  categories: Accessori,Audio,Informatica,Mobile,Networking,Storage,Ufficio,Wearable
  # Producer HTTP Basic credentials, required to create, update and delete products
  username: ${API_USERNAME:}
  password: ${API_PASSWORD:}
