services:
  db:
    image: mysql:8.0
    container_name: esercitazione-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
      # Executed only when mysql-data is initialized for the first time.
      - ./initDb.sql:/docker-entrypoint-initdb.d/01-initDb.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./product-api
      dockerfile: Dockerfile
    container_name: esercitazione-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"

volumes:
  mysql-data:
